<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIH26106 — Email Threat Detection</title>
    <meta name="description" content="AI-Powered Email Threat Detection, GeoLocation and Forensic Intelligence Platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <script>
      // Applied before React mounts to avoid a dark->light flash on
      // load. Mirrors the persistence key in ThemeContext.tsx — kept
      // in sync manually since this must run before any bundle loads.
      (function () {
        try {
          var stored = window.localStorage.getItem('sih26106.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          if (theme === 'light') document.documentElement.classList.add('light');
        } catch (e) {
          // localStorage unavailable (private browsing, etc.) — fall back to dark.
        }
      })();
    </script>
  </head>
  <body class="bg-base-950 text-ink-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
